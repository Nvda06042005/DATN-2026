name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Match Render npm version
        run: npm install --global npm@10.9.4 --no-audit --no-fund
      - name: Require PostgreSQL test tools
        run: |
          if [[ ! -x "$POSTGRES_BIN/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-16
          fi
          test -x "$POSTGRES_BIN/initdb"
          test -x "$POSTGRES_BIN/pg_ctl"
          "$POSTGRES_BIN/initdb" --version
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile backend
        run: npm run build
      - name: Validate migration files
        run: npm run migrate -- check
      - name: Test backend using disposable PostgreSQL
        run: npm test -- --testTimeout=180000 --json --outputFile=test-results.json
      - name: Require executed database tests
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const result = require('./test-results.json');
          assert.equal(result.numFailedTests, 0);
          assert.equal(result.numPendingTests, 0, 'Skipped tests must not count as a successful database check');
          assert.ok(result.numPassedTests > 0);
          NODE
      - name: Save backend test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-results
          path: backend/test-results.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use consistent npm version
        run: npm install --global npm@10.9.4 --no-audit --no-fund
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test frontend API contracts
        run: npm test
      - name: Build web app
        run: npm run build
        env:
          EXPO_PUBLIC_API_URL: https://dong-a-api.onrender.com
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      - name: Verify build identity
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const info = require('./dist/build-info.json');
          assert.equal(info.commit, process.env.GITHUB_SHA);
          NODE

  automation:
    name: Local auto-sync regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.0
      - name: Test snapshots, merge, push and deployment verification
        run: node --test scripts/auto-sync.test.mjs
