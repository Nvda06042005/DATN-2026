name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Match Render npm version
        run: npm install --global npm@10.9.4 --no-audit --no-fund
      - name: Require PostgreSQL test tools
        run: |
          if [[ ! -x "$POSTGRES_BIN/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-16
          fi
          test -x "$POSTGRES_BIN/initdb"
          test -x "$POSTGRES_BIN/pg_ctl"
          "$POSTGRES_BIN/initdb" --version
      - name: Install locked backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile backend
        run: npm run build
      - name: Validate migration files
        run: npm run migrate -- check
      - name: Test backend using disposable PostgreSQL
        run: |
          set -o pipefail
          npm test -- --testTimeout=180000 --json --outputFile=test-results.json 2>&1 | tee test-output.log
      - name: Explain backend test failure
        if: failure()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let text = '';
          try {
            const r = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            text = r.testResults.filter((s) => s.status === 'failed').map((s) => `${s.name}: ${String(s.message || '').slice(0, 700)}`).slice(0, 4).join('\n---\n');
          } catch { /* chưa có kết quả JSON: lỗi xảy ra trước khi chạy bài đầu tiên */ }
          if (!text) { try { text = fs.readFileSync('test-output.log', 'utf8').slice(-3500); } catch { text = 'Không có đầu ra kiểm thử'; } }
          // Annotation đọc được qua API công khai ngay cả khi không tải được nhật ký đầy đủ
          console.log(`::error title=Backend tests failed::${text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
          NODE
      - name: Require executed database tests
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const result = require('./test-results.json');
          assert.equal(result.numFailedTests, 0);
          assert.equal(result.numPendingTests, 0, 'Skipped tests must not count as a successful database check');
          assert.ok(result.numPassedTests > 0);
          NODE
      - name: Save backend test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-results
          path: |
            backend/test-results.json
            backend/test-output.log
          if-no-files-found: ignore
          retention-days: 7

  ai-model:
    # Cài Python cho mô hình AI giống hệt máy chủ Render (backend/scripts/setup-ai-python.mjs), rồi hỏi thử mô hình (ai/bridge_cli.py).
    # Mỗi lần nhóm AI đẩy code mới (ai/*.py, ai/requirements.txt, mô hình), bước này cho biết mô hình còn chạy được trên máy chủ không.
    name: AI Python model (same install as Render)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.0
      - name: Install Python and AI libraries like Render
        run: node scripts/setup-ai-python.mjs
        env:
          AI_PYTHON_SETUP: '1'
      - name: Ask the AI model sample questions
        run: node scripts/ai-smoke.mjs

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use consistent npm version
        run: npm install --global npm@10.9.4 --no-audit --no-fund
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test frontend API contracts
        run: npm test
      - name: Build web app
        run: npm run build
        env:
          EXPO_PUBLIC_API_URL: https://dong-a-api.onrender.com
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      - name: Verify build identity
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const info = require('./dist/build-info.json');
          assert.equal(info.commit, process.env.GITHUB_SHA);
          NODE

  automation:
    name: Local auto-sync regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.0
      - name: Test snapshots, merge, push and deployment verification
        run: node --test scripts/auto-sync.test.mjs
