# Render Blueprint: 2 dịch vụ web trong cùng vùng.
#  - dong-a-api: backend NestJS (đăng nhập, tài khoản, tiến độ, game, chấm điểm, thi đấu WebSocket, PostgreSQL/Supabase).
#    Tự chạy database/migrations/*.sql khi khởi động; lỗi migration sẽ dừng khởi động.
#  - dong-a-ai: dịch vụ AI Python (chatbot RAG, BKT, soạn đề, soạn truyện) – chỉ backend gọi, có khóa nội bộ.
# Phòng thi đấu nằm trong bộ nhớ: dong-a-api chạy MỘT instance.
# Hai dịch vụ Free gọi nhau qua HTTPS công khai; Free không nhận kết nối private network.
services:
  - type: web
    name: dong-a-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd backend && npm ci && npm run build && npm run migrate -- check
    startCommand: cd backend && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: dong-a-ai
          envVarKey: AI_PUBLIC_URL
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: dong-a-ai
          envVarKey: AI_SERVICE_TOKEN

  - type: web
    name: dong-a-ai
    runtime: python
    plan: free
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PUBLIC_URL
        fromService:
          type: web
          name: dong-a-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_TOKEN
        generateValue: true
